name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://ci_user@localhost:5432/ai_workbench_ci
      REDIS_URL: redis://localhost:6379/0
      CHAT_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ai_workbench_ci
          POSTGRES_USER: ci_user
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ai_workbench_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 5s
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare backend test environment
        shell: bash
        run: |
          cp .env.example .env
          sed -i "s|^DATABASE_URL=.*|DATABASE_URL=${DATABASE_URL}|" .env
          git check-ignore .env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest -q

      - name: Remove temporary backend environment
        if: always()
        run: rm -f .env

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  quality-check:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whitespace errors
        run: git diff --check

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          git check-ignore .env
          docker compose config --quiet
